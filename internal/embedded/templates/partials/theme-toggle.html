{{define "theme_toggle_header"}}
<button class="notes-action-button header-theme-toggle theme-toggle" type="button" aria-label="{{T .Lang "action.theme"}}">
  <span class="material-symbol" aria-hidden="true">dark_mode</span>
</button>
<button class="notes-action-button header-theme-toggle palette-toggle" type="button" aria-label="{{T .Lang "action.palette"}}" aria-pressed="true">
  <span class="material-symbol" aria-hidden="true">palette</span>
</button>
<a class="notes-action-button header-theme-toggle lang-toggle" href="{{.AlternateURL}}" aria-label="{{T .Lang "post.bilingual"}}" data-notes-tool="lang">
  <span class="material-symbol" aria-hidden="true">translate</span>
</a>
{{end}}

{{define "theme_toggle_action"}}
<button class="notes-action-button theme-toggle" type="button" aria-label="{{T .Lang "action.theme"}}" data-tooltip="{{T .Lang "tooltip.theme"}}">
  <span class="material-symbol" aria-hidden="true">dark_mode</span>
</button>
<button class="notes-action-button palette-toggle" type="button" aria-label="{{T .Lang "action.palette"}}" aria-pressed="true" data-tooltip="{{T .Lang "tooltip.palette"}}">
  <span class="material-symbol" aria-hidden="true">palette</span>
</button>
<a class="notes-action-button lang-toggle" href="{{.AlternateURL}}" aria-label="{{T .Lang "post.bilingual"}}" data-tooltip="中/EN" data-notes-tool="lang">
  <span class="material-symbol" aria-hidden="true">translate</span>
</a>
{{end}}
