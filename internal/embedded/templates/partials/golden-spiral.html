{{define "golden_spiral"}}
<div class="golden-spiral"
  data-outer-rect="{{.Spiral.OuterRect}}"
  data-outer-left-top="{{.Spiral.OuterRectLeftTop}}"
  data-outer-right-bottom="{{.Spiral.OuterRectRightBottom}}"
  data-spiral-outer-corner="{{.Spiral.SpiralOuterCorner}}"
  data-spiral-start="{{.Spiral.SpiralVisualStart}}"
  data-spiral-end="{{.Spiral.SpiralVisualEnd}}"
  data-spin-center="{{.Spiral.SpinCenterX}} {{.Spiral.SpinCenterY}}"
  data-spiral-quarters="{{.Spiral.SpiralOuterQuarterTurns}}..{{.Spiral.SpiralInnerQuarterTurns}}"
  aria-hidden="true">
  <style>
    @keyframes golden-curve-life {
      0%, {{.Spiral.CurveStartPct}}% { opacity: 0; stroke-dashoffset: 1; }
      {{.Spiral.CurveFadePct}}% { opacity: 1; stroke-dashoffset: 1; animation-timing-function: cubic-bezier(0.618, 0, 1, 1); }
      {{.Spiral.CurveGrowEndPct}}%, {{.Spiral.CurveShrinkStartPct}}% { opacity: 1; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0, 0, 0.382, 1); }
      {{.Spiral.CurveShrinkEndPct}}% { opacity: 1; stroke-dashoffset: 1; }
      {{.Spiral.CurveHidePct}}%, 100% { opacity: 0; stroke-dashoffset: 1; }
    }

    {{range .Spiral.Diagonals}}
    @keyframes g-d-{{.Order}} {
      0%, {{.GrowStartPct}}%, {{.HidePct}}%, 100% { opacity: 0; stroke-dashoffset: 1; }
      {{.GrowFadePct}}% { opacity: 1; stroke-dashoffset: 1; }
      {{.GrowEndPct}}%, {{.ShrinkStartPct}}% { opacity: 1; stroke-dashoffset: 0; }
      {{.ShrinkEndPct}}% { opacity: 1; stroke-dashoffset: 1; }
    }
    {{end}}

    {{range .Spiral.Squares}}
    @keyframes g-s-{{.Order}} {
      0%, {{.GrowStartPct}}%, {{.HidePct}}%, 100% { opacity: 0; stroke-dashoffset: 1; }
      {{.GrowFadePct}}% { opacity: 1; stroke-dashoffset: 1; }
      {{.GrowEndPct}}%, {{.ShrinkStartPct}}% { opacity: 1; stroke-dashoffset: 0; }
      {{.ShrinkEndPct}}% { opacity: 1; stroke-dashoffset: 1; }
    }
    {{end}}
  </style>

  <div class="golden-spiral-layers" style="display: grid; width: 100%; height: 100%;">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" style="grid-area: 1 / 1;">
      <g class="golden-spiral-stage" style="--golden-loop-duration: {{.Spiral.LoopDuration}}; transform-origin: {{.Spiral.SpinCenterX}}px {{.Spiral.SpinCenterY}}px;">
        {{range .Spiral.Diagonals}}
        <path class="golden-diagonal" d="{{.D}}" pathLength="1" style="animation-name: g-d-{{.Order}};"></path>
        {{end}}
        {{range .Spiral.Squares}}
        <path class="golden-rect" d="{{.D}}" pathLength="1" style="animation-name: g-s-{{.Order}};"></path>
        {{end}}
      </g>
    </svg>
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" style="grid-area: 1 / 1;">
      <g class="golden-spiral-stage" style="--golden-loop-duration: {{.Spiral.LoopDuration}}; transform-origin: {{.Spiral.SpinCenterX}}px {{.Spiral.SpinCenterY}}px;">
        <path class="golden-curve" d="{{.Spiral.SpiralPath}}" pathLength="1"></path>
      </g>
    </svg>
  </div>
</div>
{{end}}
