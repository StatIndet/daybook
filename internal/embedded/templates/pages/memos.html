{{define "content"}}
<div class="memos-page" data-memos-page>
  <section class="memos-feed article-stage" aria-label="{{T .Lang "nav.memos"}}" data-ui-aria="nav.memos">
    <header class="memos-header">
      <div class="memos-heading">
        <h1 data-ui-text="nav.memos">{{T .Lang "nav.memos"}}</h1>
        <span class="memos-count" data-memos-count aria-live="polite"></span>
      </div>
      <div class="memos-toolbar">
        <label class="memos-search">
          <span class="material-symbol" aria-hidden="true">search</span>
          <input type="search" data-memos-search autocomplete="off" spellcheck="false" placeholder="{{T .Lang "memos.search_placeholder"}}" data-ui-placeholder="memos.search_placeholder" aria-label="{{T .Lang "memos.search"}}" data-ui-aria="memos.search">
        </label>
        <button class="memos-filter-toggle" type="button" data-mobile-overlay-target="tags" aria-expanded="false" aria-label="{{T .Lang "memos.filters"}}" data-ui-aria="memos.filters">
          <span class="material-symbol" aria-hidden="true">calendar_month</span>
        </button>
      </div>
    </header>
    <div class="memos-active-filters" data-memos-active hidden>
      <span data-memos-active-label></span>
      <button type="button" data-memos-reset data-ui-text="memos.reset">{{T .Lang "memos.reset"}}</button>
    </div>
    <div class="memos-cards">
      {{range .Memos}}
      <article class="memo-card" data-memo-card data-memo-date="{{.DateDay}}" data-memo-search="{{.Title}} {{.SearchText}} {{.Date}} {{.DateDisplay}} {{.Location}} {{range .Tags}}{{.}} {{end}}" data-memo-url="{{.URL}}">
        {{template "memo_post" dict "Item" . "Config" $.Config "Lang" $.Lang "Detail" false}}
      </article>
      {{else}}
      {{template "memos_empty" .}}
      {{end}}
    </div>
    <p class="memos-empty" data-memos-empty hidden data-ui-text="search.empty">{{T .Lang "search.empty"}}</p>
  </section>
  <aside class="memos-aside" aria-label="{{T .Lang "memos.filters"}}" data-ui-aria="memos.filters">
    {{template "memos_filters" .}}
  </aside>
</div>
{{end}}
