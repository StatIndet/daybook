  <!-- Desktop UI: Side Sheet Player -->
  <div class="mm-desktop-ui" aria-label="后台播放控制" aria-hidden="true">
    
    <!-- Collapsed Tab View -->
    <div class="mm-collapsed-tab">
      <img class="mm-small-cover" src="" alt="Cover" crossorigin="anonymous">
      <div class="mm-vertical-title">--</div>
    </div>

        </div>
      </div>
      
      <div class="mm-info-wrapper">
        <div class="mm-title" title="Track Title">--</div>
        <div class="mm-artist" title="Artist">--</div>
      </div>

      <div class="mm-controls-wrapper">
        <button class="mm-btn-play-pause" type="button" aria-label="Play/Pause">
          <svg class="mm-morph-icon" viewBox="0 0 24 24">
            <!-- Triangle initially, morphs to two bars via JS/CSS -->
            <path class="mm-morph-path" d="M8 5v14l11-7z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
