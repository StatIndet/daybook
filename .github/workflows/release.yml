name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run typecheck
          npm run test:reading-rail
          npm run build:js
          npm run build:vendor

      - name: Build Binaries
        env:
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X 'main.Version=daybook ${VERSION}'"
          
          build_target() {
            local os=$1
            local arch=$2
            local ext=$3
            local outdir="release/${os}_${arch}"
            mkdir -p "$outdir"
            cp LICENSE "$outdir/"
            
            local bin_name="daybook"
            if [ "$os" = "windows" ]; then
              bin_name="daybook.exe"
            fi
            
            GOOS=$os GOARCH=$arch go build -ldflags "${LDFLAGS}" -o "$outdir/$bin_name" ./cmd/daybook
            
            cd "$outdir"
            if [ "$ext" = "zip" ]; then
              zip -q "../../daybook_${VERSION}_${os}_${arch}.zip" "$bin_name" LICENSE
            else
              tar -czf "../../daybook_${VERSION}_${os}_${arch}.tar.gz" "$bin_name" LICENSE
            fi
            cd ../..
          }

          # Matrix targets
          build_target linux amd64 tar.gz
          build_target linux arm64 tar.gz
          build_target darwin amd64 tar.gz
          build_target darwin arm64 tar.gz
          build_target windows amd64 zip
          build_target windows arm64 zip
          build_target freebsd amd64 tar.gz
          build_target openbsd amd64 tar.gz
          build_target openbsd arm64 tar.gz
          build_target netbsd amd64 tar.gz
          build_target dragonfly amd64 tar.gz

      - name: Generate Checksums
        run: |
          sha256sum daybook_*.tar.gz daybook_*.zip > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            daybook_*.tar.gz
            daybook_*.zip
            checksums.txt
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true
