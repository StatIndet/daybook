name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-unix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        
      - name: Check POSIX syntax
        run: shellcheck -s sh scripts/install.sh

      - name: Run checks
        run: ./scripts/check.sh

  check-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Native Binary
        run: |
          go build -o daybook.exe ./cmd/daybook
          .\daybook.exe --version

      - name: Verify cross-build capability (arm64)
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          go build -o daybook_arm64.exe ./cmd/daybook
        shell: powershell

      - name: Test Architecture Mapping (WOW64)
        shell: powershell
        run: |
          $ScriptCode = Get-Content -Raw -Path scripts\install.ps1
          $FunctionOnly = ($ScriptCode -split "# 1. Detect OS & Architecture")[0]
          
          # Simulate WOW64 (x86 PowerShell on x64 Windows)
          $env:PROCESSOR_ARCHITECTURE = "x86"
          $env:PROCESSOR_ARCHITEW6432 = "AMD64"
          
          $ArchResult = Invoke-Command -ScriptBlock ([scriptblock]::Create($FunctionOnly + "`nGet-DaybookArchitecture"))
          if ($ArchResult -ne "amd64") {
              throw "WOW64 Simulation failed. Expected amd64, got $ArchResult"
          }
          
          # Simulate ARM64
          $env:PROCESSOR_ARCHITECTURE = "ARM64"
          Remove-Item Env:\PROCESSOR_ARCHITEW6432 -ErrorAction SilentlyContinue
          
          $ArchResult2 = Invoke-Command -ScriptBlock ([scriptblock]::Create($FunctionOnly + "`nGet-DaybookArchitecture"))
          if ($ArchResult2 -ne "arm64") {
              throw "ARM64 Simulation failed. Expected arm64, got $ArchResult2"
          }

      - name: Test Installer (PowerShell 5.1)
        shell: powershell
        run: |
          $env:DAYBOOK_INSTALL_DIR = "$env:RUNNER_TEMP\daybook-test-ps5"
          & .\scripts\install.ps1
          
          if (-not (Test-Path "$env:DAYBOOK_INSTALL_DIR\daybook.exe")) {
              throw "Executable not found in install dir"
          }

      - name: Test Installer (PowerShell 7)
        shell: pwsh
        run: |
          $env:DAYBOOK_INSTALL_DIR = "$env:RUNNER_TEMP\daybook-test-pwsh"
          & .\scripts\install.ps1
          
          if (-not (Test-Path "$env:DAYBOOK_INSTALL_DIR\daybook.exe")) {
              throw "Executable not found in install dir"
          }
